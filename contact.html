<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Contact Joan Oherein and use the front-end validated portfolio contact form."><title>Contact | Joan Oherein</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><img class="brand-mark" src="images/Profile.Jpeg" alt=""><span>Joan Oherein</span></a><button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"><span></span><span></span><span></span></button><nav id="primary-nav" class="primary-nav" aria-label="Primary navigation"><a href="index.html">Home</a><a href="about.html">About Me</a><a href="projects.html">Projects</a><a href="planner.html">Academic Planner</a><a class="active" href="contact.html" aria-current="page">Contact</a></nav></div></header>
<main id="main-content"><section class="page-header"><div class="container"><p class="eyebrow">Contact</p><h1>Start a conversation</h1></div></section>
<section class="section"><div class="container contact-form-wrap">
<form id="contact-form" class="contact-form" novalidate><div class="field"><label for="full-name">Full name <span aria-hidden="true">*</span></label><input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="Your full name" aria-describedby="full-name-error"><p id="full-name-error" class="field-error" aria-live="polite"></p></div><div class="field"><label for="email">Email address <span aria-hidden="true">*</span></label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" aria-describedby="email-error"><p id="email-error" class="field-error" aria-live="polite"></p></div><div class="field"><label for="phone">Phone number <span aria-hidden="true">*</span></label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Digits only, e.g. 08012345678" aria-describedby="phone-error"><p id="phone-hint" class="field-hint">Enter at least 7 digits without letters, spaces, or symbols.</p><p id="phone-error" class="field-error" aria-live="polite"></p></div><div class="field"><label for="message">Message <span aria-hidden="true">*</span></label><textarea id="message" name="message" rows="6" placeholder="Write your message here" aria-describedby="message-error"></textarea><p id="message-error" class="field-error" aria-live="polite"></p></div><button class="button" type="submit">Validate Message</button><div id="form-success" class="form-success" role="status" aria-live="polite"></div></form></div></section></main>
<footer class="site-footer"><div class="container footer-grid"><div><a class="brand brand-light" href="index.html"><img class="brand-mark" src="images/Profile.Jpeg" alt=""><span>Joan Oherein</span></a></div><nav aria-label="Footer navigation"><a href="index.html">Home</a><a href="about.html">About Me</a><a href="projects.html">Projects</a><a href="planner.html">Academic Planner</a><a href="contact.html">Contact</a></nav></div><div class="container footer-bottom"><p>&copy; <span id="current-year">2026</span> Joan Oherein</p></div></footer>
<script src="js/script.js"></script>
</body></html>
